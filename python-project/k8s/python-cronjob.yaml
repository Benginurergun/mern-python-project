apiVersion: batch/v1
kind: CronJob
metadata:
  name: python-etl-cron
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: etl
              image: python-etl:latest
              imagePullPolicy: IfNotPresent
          restartPolicy: Never
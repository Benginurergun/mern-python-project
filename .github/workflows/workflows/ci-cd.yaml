name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server deps
        working-directory: ./server
        run: npm install

      - name: Install client deps
        working-directory: ./client
        run: npm install

      - name: Done
        run: echo "CI successful"
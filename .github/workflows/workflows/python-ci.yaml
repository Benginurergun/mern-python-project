name: Python ETL CI

on:
  push:
    paths:
      - "python-project/**"
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./python-project
        run: |
          pip install -r requirements.txt

      - name: Run ETL script
        working-directory: ./python-project
        run: |
          python ETL.py